# medimageinsight_davit_huge_v5_96slices_per_finding_attn_sam
#
# PERFINDINGATTN-96 RECIPE ON MII, WITH SAM (11 Oct, user). convnext_base_v5_96slices_per_finding_attn (the same recipe on ConvNeXt-B,
# no SAM) scored solo LB 0.939, our best single by +0.011; MII DaViT-Huge is our best backbone; SAM gave the
# ConvNeXt twin audit +0.0077 / clean +0.0029. This puts the three together.
# Recipe copied from convnext_base_v5_96slices_per_finding_attn_sam (5 slots / 96 slices, 12 random 3-slice windows in training, all 94
# at eval, 384 px at 0.365 mm/px = 140 mm, per-finding attention head, wd 0.059, 16 epochs).
# Changed for MII:
#   backbone davit_huge_fl + the MII weights (train.py, as medimageinsight_davit_huge_336_v3_f0), ImageNet norm
#   backbone lr 3e-5 FLAT (MII's lr; no layer decay, since LLRD would put the top of the trunk next to the 2e-3
#     head), head 2e-3 as 96slices_per_finding_attn -> backbone_lr_mult 0.015
#   H200 (MII needed 116 GB for 192 images at 336; this is 96 at 384 plus SAM), val batch 2 (2 x 94 windows)
#   validations (user): every 800 steps for epochs 1-6, then every 100; patience 7 (= 700 steps)
# Cost (from the MII run's measured 250 img/s on H200): training ~2.2 h, ~53 validations x ~3.5 min ~3.1 h,
# ~5.3 h at ~$6/h = ~$31 if it runs all 16 epochs; early stopping can cut it.

experiment:
  name: "medimageinsight_davit_huge_v5_96slices_per_finding_attn_sam"

paths:
  train_csv: "23_train_w50.csv"      # v5 split, v4 labels
  val_csv:   "23_val_v3_audit.csv"   # 346 v3-labelled + the 58 audit studies

model:
  name: "davit_huge_fl"
  pretrained: true                  # MII weights via external_backbones (train.py)
  drop_rate: 0.0                    # the head has its own dropout 0.2 inside the attention scorer
  grad_checkpointing: false

input:
  laterality_flip: "left"
  norm_mean: [0.485, 0.456, 0.406]  # MedImageInsight config.yaml and timm agree
  norm_std:  [0.229, 0.224, 0.225]
  slots: ["sag_fluid", "sag_plain", "cor_fluid", "cor_plain", "ax_fluid"]
  n_slices: {sag_fluid: 26, sag_plain: 22, cor_fluid: 18, cor_plain: 12, ax_fluid: 18}          # 96
  slices_as_channels: {sag_fluid: 26, sag_plain: 22, cor_fluid: 18, cor_plain: 12, ax_fluid: 18} # 1 slice per plane
  window_bag: {train_k: 12, eval_k: 94}
  size: 384
  mm_per_px: 0.365                  # 384 x 0.365 = 140 mm
  slice_margin: 0.06
  fallback_same_plane: ["sag_fluid", "sag_plain", "cor_fluid", "ax_fluid"]

training:
  epochs: 16
  lp_ft_epochs: 0
  grad_clip: 3.0
  optimizer:
    name: "adamw"
    weight_decay: 0.059
    lr: 3.0e-5                      # backbone, flat
    backbone_lr_mult: 0.015         # head = 3e-5 / 0.015 = 2.0e-3
    layer_decay: null
  scheduler:
    name: "cosine"
    warmup_frac: 0.05
    min_lr_mult: 0.01
  loss:
    name: "bce"
    pos_weight: null
    focal_gamma: 2.0
    aucm_margin: 1.0
    aucm_bce_mix: 0.1
  early_stopping:
    enable: true
    monitor: "val_macro_auroc"
    mode: "max"
    patience: 7                     # validations (user), = 700 steps at every 100
  sam:
    enable: true
    rho: 0.05
    adaptive: false

dataloader:
  batch_size: 8                     # 8 studies x 12 windows = 96 images per step
  accum_steps: 1                    # SAM needs 1
  val_batch_size: 2                 # 2 x 94 = 188 images per eval batch
  num_workers: 26
  val_num_workers: null
  prefetch_factor: 4
  pin_memory: true
  persistent_workers: true
  drop_last: false

modal:
  gpu: "H200"
  cpu: 16.0
  memory_gb: 96

evaluation:
  eval_every_steps_before: 800      # epochs 1-6
  eval_every_steps_epoch_mid_threshold: null   # two tiers
  eval_every_steps_after: 100       # epoch 7 onward
  eval_every_steps_epoch_threshold: 7

reproducibility:
  seed: 42
