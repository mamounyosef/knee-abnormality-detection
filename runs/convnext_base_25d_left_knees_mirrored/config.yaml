# convnext_base_25d_18slices with every knee MIRRORED TO FACE THE SAME WAY.
#
# THE ONE VARIABLE. Byte-identical to convnext_base_25d_18slices (val 0.9010) except
# input.laterality_flip: "left". Any difference from 0.9010 is the normalisation.
#
# WHAT THE PROBLEM IS. "Medial" means the inner side of the leg, the side facing the other
# leg. On a scan that lands on one half of the image for a right knee and the OTHER half for
# a left knee, because a left knee and a right knee are mirror images. Four of the twelve
# findings are named for that axis - Medial Meniscus, Lateral Meniscus, Medial OA, Lateral
# OA - and two more are anatomically one-sided (MCL is a band on the inner edge, a Baker's
# cyst sits at the back toward the inner side). So the model has been learning each of those
# twice, once per mirror image, from a corpus split 2,469 right / 1,938 left.
#
# Medically the flip costs nothing: a mirrored left knee is anatomically indistinguishable
# from a right knee, so every label stays exactly as valid as it was.
#
# WHY "left". Mirroring is lossless, so the direction is arithmetically arbitrary. Left is
# the MINORITY side (1,938 against 2,469), so flipping it leaves the larger group untouched
# and ends with every study facing like a right knee. That also makes the inference-time
# failure mode benign: a test study whose side cannot be read from its DICOM headers is left
# unflipped, and unflipped is right-facing, which is the correct answer 56% of the time.
#
# WHAT THE DIAGNOSTICS SAID, AND WHY THIS RUN EXISTS ANYWAY. Two no-training tests said the
# model is not obviously suffering: splitting the 0.932 ensemble's predictions by side showed
# no accuracy gap (side-specific findings 0.0175 mean absolute gap, the others 0.0200), and
# mirroring the input under a checkpoint trained without normalisation cost -0.0289 macro,
# but with the damage landing mostly on findings where orientation is meaningless (ACL
# -0.0677, PF OA -0.0528) rather than on the side-specific four (excess of only ~0.008).
#
# Neither test can settle the actual question, which is whether the model WASTES CAPACITY
# learning each side-specific finding twice. That is invisible to any test that does not
# retrain, because it is about what the weights could have spent themselves on instead.
# This run is that test, and it is the cheapest one available: 24 forward passes per study.
#
# hflip augmentation stays at p: 0.0. It has to - a random horizontal flip would mirror
# studies back at random and undo exactly what this run is for.
#
# Beat: convnext_base_25d_18slices, val 0.9010.

experiment:
  name: "convnext_base_25d_left_knees_mirrored"

paths:
  # Byte-identical split MEMBERSHIP to convnext_base_25d_group3 and convnext_base_336px.
  train_csv: "05_train_qwen24t-med.csv"
  val_csv:   "05_val_qwen24t-med.csv"
  # audit_csv stays 05_audit58.csv - the panel labels never change, so it is the one
  # honest cross-label-set comparison.

model:
  name: "convnext_base.fb_in22k_ft_in1k"   # timm id: ConvNeXt-Base pretrained on ImageNet-22k
  pretrained: true
  pool: "mean"                      # how the 24 image features collapse per study: mean | max | attn
  drop_rate: 0.1                    # dropout in the head, mild regularization

input:
  # THE ONE VARIABLE. Mirror every LEFT knee so the whole corpus faces like a right knee,
  # and "medial" is always the same half of the frame. Sides come from
  # data/12_laterality.csv at train time and straight from the DICOM headers at submission
  # time, both by the sign of x in ImagePositionPatient (+x points to the patient's left).
  laterality_flip: "left"

  # 336 x 0.40 = 134 mm of frame, unchanged. mm_per_px stays 0.40, the value every run in
  # this project has used: it is the knob that controls interpolation, and at 0.40 exactly
  # 24.4% of series are upsampled (median 1.17x).
  size: 336

  # 18 real slices per slot, down from the shared default of 24. This is the ONLY difference
  # from convnext_base_25d_group3.
  n_slices: 18

  # 6 IMAGES PER SLOT, each holding 3 consecutive slices in its 3 channels.
  # prepare_batch reshapes (B, 4, 18, H, W) -> (B*4*6, 3, H, W). The slice axis splits with
  # the GROUP as the outer index and the CHANNEL as the inner one, so the groups are
  # contiguous and non-overlapping: (0,1,2), (3,4,5), ... (15,16,17).
  # 18 / 6 = 3 means train.py builds the backbone with in_chans=3, i.e. the pretrained stem
  # exactly as shipped. No filter tiling, no rescaling, no adaptation.
  slices_as_channels: 6

training:
  epochs: 12
  grad_clip: 3.0                    # 3.0, NEVER 1.0. 1.0 clips every step and silently
                                    # throttles the effective learning rate.
  optimizer:
    name: "adamw"
    weight_decay: 0.05
    lr: 5.0e-5                      # BACKBONE lr, identical to convnext_base_25d_group3 so
                                    # the slice count is the only variable
    backbone_lr_mult: 0.5           # head = lr / 0.5 = 1.0e-4, twice the trunk
    layer_decay: null
  scheduler:
    name: "cosine"
    warmup_frac: 0.05
    min_lr_mult: 0.01               # floor: ends at 1% of the base learning rate
  loss:
    name: "bce"                     # bce = binary cross-entropy | focal = focuses on hard cases
    pos_weight: null
    focal_gamma: 2.0
    aucm_margin: 1.0
    aucm_bce_mix: 0.1
  # EXTENSION. The run finished all 12 epochs without early stopping, at a backbone lr of
  # 1.0e-6 (the cosine floor, 1% of the 5.0e-5 peak). Its last four epochs gained +0.0003,
  # +0.0002, +0.0003, so it is converged rather than cut short - but it was still creeping
  # UP where the baseline had already peaked at epoch 9 and drifted down, which is the one
  # reason to spend more on it.
  #
  # WHY 8.0e-6 AND NOT SOMETHING NEARER 1.0e-6. "Slightly higher" in absolute terms would be
  # ~2.0e-6, which is 4% of the original peak and would move almost nothing: the extension
  # would reproduce the last epoch twelve more times. 8.0e-6 is 16% of the original peak and
  # 8x the finishing rate, which is the shape that has actually paid in this project -
  # dinov3_convnext_base restarted at exactly 8.0e-6 after converging and gained, and
  # convnext_base_fluid gained +0.0215 the same way. It is well short of a restart.
  # DISABLED. _mirror_slot changed under this run: it trained its 12 epochs
  # with every slot flipped horizontally, which corrupted the two sagittal
  # slots. Resuming now would train the extension on a DIFFERENT input than
  # the run started with, and the result would describe neither. The question
  # moved to convnext_base_25d_all_knees_same_orientation.
  extend:
    enable: false
    epochs: 6                       # on TOP of the 12 already done
    lr: 8.0e-6                      # new PEAK. Every group scales by the same ratio, so the
                                    # 0.5 backbone_lr_mult survives: head becomes 1.6e-5.
    warmup_frac: 0.02               # short re-warm so the jump from 1.0e-6 is not a shock
    min_lr_mult: 0.10               # NOT the run's 0.01. Six epochs at a 1% floor spends most
                                    # of them below 1e-7, doing nothing. 10% keeps them working.
    reset_optimizer: false          # keep the AdamW moments; the weights are not being reset
    reset_patience: true            # early stopping starts fresh for the extension

  early_stopping:
    enable: true
    monitor: "val_macro_auroc"
    mode: "max"
    patience: 12                     # VALIDATIONS without improvement, not epochs.

# CPU-side loading; decoding shards is the bottleneck and stays one here, though 18 slices
# is a quarter less to decode per study than 24.
dataloader:
  batch_size: 8                     # 8 studies x 4 slots x 6 images = 192 images @336.
                                    # MEASURED basis: convnext_base_25d_group3 peaked at
                                    # 71.02 GB on 256 images, i.e. ~0.273 GB/image, so 192
                                    # images is ~54 GB of the A100-80GB. Comfortable.
  accum_steps: 1                    # effective 8 studies per update - IDENTICAL to every
                                    # other run, so step counts and the lr schedule compare
                                    # directly against convnext_base_25d_group3
  val_batch_size: 16                # 16 studies x 24 images = 384 images, but with no
                                    # backward pass there are no stored activations, so this
                                    # is far cheaper than the training batch despite being
                                    # twice the studies. Speeds the validations up.

  num_workers: 26                   # the GPU does a quarter of convnext_base_336px's work
                                    # per study, so the loader is the binding constraint
  val_num_workers: null             # null = same as num_workers

  prefetch_factor: 6                # batches queued per worker
  pin_memory: true                  # page-locked memory, faster CPU -> GPU copies
  persistent_workers: true          # don't respawn workers every epoch
  drop_last: false                  # keep the ragged final batch

modal:
  gpu: "H100"                     # H100 SXM5 $3.95/h against the A100-80GB's $2.50/h, but
                                    # measured 2.2-2.3x the throughput on ConvNeXt-Base
                                    # @336px, so ~35% more images per dollar. These runs
                                    # are compute bound (data_wait_pct 4.6%), so the
                                    # extra speed is real rather than idle time.
                                    # PEAK HERE IS 53.5 GB, inside the 80 GB card.
  cpu: 16.0                         # raised with the GPU: at 2.2x the compute
                                    # speed the loader has to feed 2.2x as fast
                                    # or the card idles. A reservation, not a
                                    # cap. Watch data_wait_pct: over ~10%% means
                                    # raise it again.
  memory_gb: 64                     # 26 workers x prefetch 6 x ~32 MB per queued batch

# inherits resume: "last" from shared_config - the preemption-safe setting.
