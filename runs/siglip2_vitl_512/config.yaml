# SigLIP 2 ViT-L/16, pretrained NATIVELY at 512x512 on WebLI.
#
# The capacity arm of siglip2_vitb_512. Everything is held fixed except the backbone size,
# and the two knobs that size forces (batch and gradient checkpointing), so the comparison
# reads as capacity alone.
#
# WHY BOTHER, given that capacity has paid nothing since ConvNeXt-Small. Base -> Large was
# +0.0008, Small -> Base +0.0011, and convnext_large lost on audit despite 4x the params.
# Two reasons this arm is still worth one run:
#   1. every one of those was SUPERVISED ImageNet pretraining, where the ceiling is the
#      label set. This is language-supervised on ~10B pairs, where the supervision signal
#      is far richer and larger models have more to absorb.
#   2. SigLIP 2's own scaling holds cleanly from B to L to SO400M on general benchmarks.
# If it also flattens here, that is a genuine result about our data, not about ImageNet.
#
# Run AFTER the Base arm, so its result informs whether this is worth the compute.

experiment:
  name: "siglip2_vitl_512"

paths:
  train_csv: "05_train_qwen24t-med.csv"
  val_csv:   "05_val_qwen24t-med.csv"

model:
  name: "vit_large_patch16_siglip_gap_512.v2_webli"
  # the GAP variant: plain average over patch tokens instead of SigLIP's MAP
  # head, a learned probe trained to emit a CAPTION-aligned vector. Frozen, gap
  # probes 0.7016 against map's 0.6710 on 300 of our studies - the caption probe
  # discards knee signal the trunk clearly has.
  pretrained: true                  # ~316M params, Apache-2.0, ungated
  pool: "mean"
  drop_rate: 0.1
  drop_path_rate: 0.2               # RAISED from Base's 0.1: 3.4x the parameters on the
                                    # same 3,639 studies, so more stochastic depth
  grad_checkpointing: true          # REQUIRED here. ViT-L is 24 blocks of width 1024 over
                                    # 1024 tokens; without recompute a single study's
                                    # activations do not leave room for a second. Costs
                                    # ~30% speed and buys the run.

input:
  # SigLIP normalises to mean 0.5 / std 0.5, NOT ImageNet. check_normalization enforces it.
  norm_mean: [0.5, 0.5, 0.5]
  norm_std:  [0.5, 0.5, 0.5]

training:
  epochs: 16
  grad_clip: 3.0
  lp_ft_epochs: 2                 # LP-FT: epochs 1-2 train the HEAD ALONE on frozen
                                  # features, then the backbone unfreezes. The first
                                  # attempt at this run fine-tuned end to end from step 0
                                  # and stalled at 0.6325 - the worst first validations in
                                  # the project - while a FROZEN probe of the same trunk
                                  # scored 0.7016, the best backbone we own. Good features
                                  # ruined by the fine-tune is Kumar et al. ICLR 2022
                                  # (arXiv 2202.10054): a random head back-propagates noise
                                  # into a good trunk before it can use it. Their fix is
                                  # exactly this, worth ~10% out-of-distribution.
  optimizer:
    name: "adamw"
    weight_decay: 0.05
    lr: 5.0e-5                      # SAME as the Base arm, deliberately. Halving it "because
                                    # the model is bigger" is convention, not evidence, and
                                    # both our data and the theory say otherwise: convnext_large
                                    # kept convnext_base's 5e-5 and became our best single model
                                    # at 0.9061, and width scaling (lr ~ 1/sqrt(width), 768 ->
                                    # 1024) would justify 4.3e-5 at most, not 2.5e-5. Holding it
                                    # equal also makes Base vs Large a ONE-variable test of
                                    # capacity. Stability comes from warmup 0.15, drop_path 0.2
                                    # and grad_clip 3.0.
    backbone_lr_mult: 0.5           # head = 1e-4
    layer_decay: null
  scheduler:
    name: "cosine"
    warmup_frac: 0.04               # ~291 steps, under two thirds of an epoch. NOT the usual 0.10:
                                    # that is ~728 steps = 1.6 epochs, which would overlap
                                    # almost the whole of LP-FT phase 1 (2 epochs = 910
                                    # steps) and leave the head still ramping up when the
                                    # backbone unfreezes - defeating the point of probing
                                    # first. Warmup exists to protect the pretrained TRUNK
                                    # from early noise, and in phase 1 the trunk is frozen,
                                    # so there is nothing to protect.
    min_lr_mult: 0.01
  loss:
    name: "bce"
    pos_weight: "auto_clamped"
    focal_gamma: 2.0
    aucm_margin: 1.0
    aucm_bce_mix: 0.1
  extend:
    enable: false
  early_stopping:
    enable: true
    monitor: "val_macro_auroc"
    mode: "max"
    patience: 4

dataloader:
  batch_size: 1                     # 96 images @512 per step. With checkpointing on, ViT-L
                                    # should sit well inside the H200; raise to 2 only after
                                    # seeing the first gpu_mem(peak) print.
  accum_steps: 8                    # effective 8 studies per update - the SAME as every
                                    # other run, so the step count and lr schedule still
                                    # line up despite the smaller batch
  val_batch_size: 2
  num_workers: 24
  val_num_workers: null
  prefetch_factor: 4
  pin_memory: true
  persistent_workers: true
  drop_last: false

modal:
  gpu: "H200"
  cpu: 16.0
  memory_gb: 56
  timeout_hours: 12                 # ~3.5x Base's per-step cost, plus checkpointing
