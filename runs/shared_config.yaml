# shared_config.yaml — settings common to every knee experiment.
# Each run's config.yaml is deep-merged on top of this (the run wins).

paths:
  data_dir:     "d:/My Projects/knee_abnormality_detection/data"
  shards_dir:   "d:/My Projects/knee_abnormality_detection/data/shards"
  train_csv:    "05_train.csv"          # 3,639 studies, soft LLM labels
  val_csv:      "05_val.csv"            # 704 studies, soft LLM labels
  audit_csv:    "05_audit58.csv"        # 58 studies, the panel's 0/1 labels
  series_index: "07_series_index.csv"
  laterality_csv: "12_laterality.csv"   # which knee each study is, left or right

# order fixes every label tensor, metric vector and submission column
tasks:
  - ACL
  - MCL
  - Medial Meniscus
  - Lateral Meniscus
  - Medial OA
  - Lateral OA
  - PF OA
  - Effusion
  - Synovitis
  - Baker's
  - Contusion
  - Fracture

input:
  # the 4 scans fed per study: sag/cor/ax = slicing direction, fluid = bright-water
  # sequence that lights up swelling, plain = normal anatomy contrast
  slots: ["sag_plain", "sag_fluid", "cor_fluid", "ax_fluid"]
  fallback_same_plane: true         # covers the 12.6% missing a slot
  duplicate_rule: "coverage"        # which series wins when several fit one slot
                                    # coverage | resolution | slices | series_number | random

  # Laterality normalisation. "Medial" means the inner side of the leg, which is the LEFT
  # of the image for a right knee and the RIGHT of it for a left knee, so the four
  # side-specific findings (Medial/Lateral Meniscus, Medial/Lateral OA) sit on opposite
  # halves of the frame depending on which leg was scanned. Set this to "right" or "left"
  # to mirror that side so every study faces the same way. null = off, which is what every
  # run so far trained with.
  laterality_flip: null

  n_slices: 24                      # real slices, never interpolated
  slice_margin: 0.05                # skip the outer 5% of the stack (edge slices are empty)
  slice_sampling: "even"            # even | random  (val/audit: evenly spaced, reproducible)
  train_slice_sampling: "random"    # doubles as augmentation

  # scanners differ up to 5x in zoom; rescale so a knee is the same pixel size everywhere
  mm_per_px: 0.40                   # null = skip physical resampling
  size: 512                         # 0.40 x 512 = 205 mm, full anatomy in frame
  resize_to: null                   # null = feed the backbone `size` unchanged. Set it to
                                    # a smaller side and prepare_batch downscales on GPU,
                                    # once, on the SAME code path for training, validation
                                    # and inference - so there is no train/test mismatch.
                                    # It exists so a backbone that cannot take `size` (a
                                    # patch-14 ViT: 512/14 is not an integer) still shares
                                    # the ensemble's single DICOM decode pass, which the
                                    # geometry check in predict_dicom_ensemble would
                                    # otherwise forbid. Keep `mm_per_px` at the shared 0.40
                                    # so the FIELD OF VIEW is unchanged and the smaller
                                    # image really is just this one shrunk.
  interpolation: "area"

  # shards were stored with a wide 0.1-99.9 window, which leaves tissue in the bottom
  # ~15% of the range (p50=9/255). Re-window at run time to use the full range.
  window: "volume"                  # shard = leave as stored | volume = one window per stack | slice
  window_pct: [1.0, 99.0]           # clip to these intensity percentiles, then stretch to 0-255
  channels: 3                       # grey slice copied 3x, because ImageNet backbones expect RGB
  norm_mean: [0.485, 0.456, 0.406]  # ImageNet statistics the pretrained weights were trained with
  norm_std:  [0.229, 0.224, 0.225]

# train split only — random distortions so the model generalizes; p = chance per study
augmentation:
  enable: true
  eval_enable: false                # also augment the EVAL split. Only for test-time
                                    # augmentation - leave false for any real run, or
                                    # validation stops being reproducible.
  rotation:   {p: 0.3, deg: 10}
  translate:  {p: 0.3, frac: 0.05}
  scale:      {p: 0.3, range: [0.90, 1.10]}
  brightness: {p: 0.3, factor: 0.15}
  contrast:   {p: 0.3, factor: 0.15}
  hflip:      {p: 0.0}              # would swap medial <-> lateral
  slice_dropout: {p: 0.1, frac: 0.1}  # blank a few slices, mimics gaps and artifacts

# labels are probabilities from a language model reading the reports, not 0/1 truth
target:
  mode: "soft"                      # soft = train on the probability | hard = round it to 0/1
  hard_threshold: 0.5
  label_smoothing: 0.0              # hard mode only

# epochs and the whole optimizer / scheduler / loss / early_stopping blocks
# are per-run — see each run's config.yaml
training:
  # Cap on the gradient's total size, so one bad batch cannot blow up training.
  # 3.0, NOT 1.0, and it lives here rather than per-run because 1.0 is low enough to
  # fire on most steps for some trunks and that silently throttles the learning rate:
  # a step whose gnorm is 2.5 gets rescaled to 1.0, so it moves at 40% of the lr the
  # config claims. Measured, twice - convnext_small_posweight was clipped on 32% of
  # steps at 1.0, and dinov3_convnext_base on 88%, which cost it ~0.11 val AUROC
  # against the identical config on an ImageNet trunk. Self-supervised trunks run the
  # highest gradients and are hurt worst. Raise it, never lower it, and check the
  # clip_pct column in train_log.csv before trusting a comparison between two runs.
  grad_clip: 3.0

  # LP-FT = Linear Probing then Fine-Tuning. Epochs 1..N train ONLY the head on frozen
  # features; from N+1 the backbone unfreezes and everything trains normally.
  #
  # OFF by default (0) because every run so far trained without it and their numbers must
  # stay comparable. Turn it on for a backbone whose FROZEN features are good but whose
  # fine-tune misbehaves - that pattern is Kumar et al. ICLR 2022 (arXiv 2202.10054): a
  # randomly initialised head back-propagates noise into a good trunk and destroys the
  # features before it has learned to use them, so full fine-tuning ends up BELOW a frozen
  # linear probe. We hit it exactly with siglip2_vitb_512: frozen probe 0.7016, the best
  # backbone we own, but fine-tuned it stalled at 0.6325.
  #
  # Check runs/others/frozen_probe.py before reaching for this - if the frozen features
  # probe near chance, LP-FT will not help and the backbone is simply wrong for the task.
  lp_ft_epochs: 0

  # Auxiliary supervision from the radiology REPORTS, not just the 12 labels.
  #
  # The 12 labels give one study at most 12 bits of gradient, across 3,638 training
  # studies, to an 86M-parameter trunk. The reports those labels were WRITTEN FROM are a
  # median 1,013 characters and carry laterality, location, severity and findings with no
  # label column at all. runs/others/encode_reports.py turns each report into one vector
  # with Qwen3-Embedding-8B (chosen by measurement: a linear model recovers the 12 findings
  # from its vectors at 0.9634, against 0.9112 for bge-large and 0.9072 for all-mpnet).
  #
  # Training then adds  weight * (1 - cosine(aux_head(feature), report_vector)).
  #
  # It costs NOTHING at inference: the model returns (logits, aux_pred) in training mode
  # and plain logits under eval(), so validation, the ensemble path and the Kaggle notebook
  # are untouched, and no text is needed at submission time.
  #
  # The run's model must define the head and return the tuple; the engine only supplies the
  # target and the loss term. `aux_cos_loss` is logged separately in train_log.csv - if it
  # does not fall, the head is not learning the report and the idea is dead.
  aux_report:
    enable: false
    path: "11_report_emb.npz"       # resolved like every other path, so data/<name>. The
                                    # file already travels in the Modal image: modal_image()
                                    # ships data/ minus shards, stats and the big formats,
                                    # and 32 MB of npz is not on that ignore list.
    weight: 0.3                     # relative to the BCE term. Untested; the first run
                                    # should treat this as the main thing being tuned.

  # log10(update / weight) per weight tensor, written to ud_ratio.csv and plotted with
  # the rest. It measures whether each layer is ACTUALLY moving, instead of trusting that
  # the configured learning rate reached it - a frozen trunk and a throttled one look
  # identical in the loss curve. Roughly -3 is healthy for a layer training from scratch;
  # a pretrained trunk should sit around -5 to -6, and far below that is frozen. On by
  # default and cheap (one extra pass over the weights every 200 steps): it caught a fully
  # frozen trunk at -9.02 that two rounds of reasoning had missed, and showed layer_decay
  # 0.9 producing no depth ordering at all.
  log_ud_ratio:
    every_steps: 200                # cadence only - the logging itself is not optional

  amp: true                         # mixed precision: half-precision math, ~2x faster, less VRAM
  channels_last: true               # memory layout that suits tensor-core convolutions
  perf:
    tf32: true                      # tensor-float32 matmuls, free speed on Ampere+
    compile: false                  # torch.compile: faster steps, slow first epoch
    compile_mode: "default"

  # Continue a run that FINISHED but was still improving, on a fresh lr curve.
  # A plain `resume` restores the exhausted cosine (lr sits at 1% of base), so it
  # would carry on training at effectively nothing. This keeps the weights and the
  # AdamW moments and starts a NEW cosine over the extra epochs instead - far
  # cheaper than retraining from scratch to test a longer schedule.
  # Set enable: true in a RUN's config, run it again, and it picks up from `resume`.
  extend:
    enable: false                   # off everywhere by default
    epochs: 5                       # extra epochs ON TOP of what the checkpoint did
    lr: null                        # new PEAK lr; null = reuse training.optimizer.lr.
                                    # Every param group is scaled by the same ratio, so
                                    # backbone_lr_mult / layer_decay splits survive.
    warmup_frac: 0.02               # short re-warm, so the lr jump does not shock the
                                    # weights; null = keep the run's own warmup_frac
    min_lr_mult: null               # floor for the EXTENSION's cosine only, as a fraction of
                                    # its new peak. null = keep the run's scheduler.min_lr_mult
                                    # (1%). An extension is only a few epochs, so 1% spends
                                    # most of them at a lr too small to move anything - 0.05
                                    # or 0.10 keeps the extra epochs doing real work.
    reset_optimizer: false          # false = keep the AdamW moments (usually right)
    reset_patience: true            # start early stopping fresh for the extension

# Inference-only settings. These never touch training.
inference:
  # BOTH T4s, by splitting the MEMBERS across them rather than the batch. Each model lives
  # on exactly one card, so the total weight memory equals the single-card path and each
  # card carries about half. Replicating every model onto both cards - the first design -
  # is what left a 15 GiB T4 with 256 MiB free before any work.
  max_gpus: 2

  # DECODE ONCE across geometry groups. This is the bigger win anyway: decode was 10.589 of
  # 18.418 s per study (57%) in the nine-member run, because each group re-read and
  # re-decompressed every DICOM although the raw volume is geometry-independent. Studies are
  # walked in chunks so scratch disk holds one chunk at a time. A cached read measured 65x
  # faster than decoding, and byte-identical.
  shared_decode: true
  decode_chunk: 32

  # The backend tweaks stay OFF for now: cudnn.benchmark profiles each convolution and its
  # workspaces are a plausible part of the memory that ran the T4 out. Re-enable alone,
  # after decode-once is confirmed, so a failure has one cause.
  tune_backend: false

evaluation:
  # validation cadence is driven by the GLOBAL STEP, not the epoch. The epoch only
  # picks which interval applies - early epochs move fast and are not worth scoring
  # often, later ones are where the best checkpoint usually appears.
  # THREE tiers, coarse to fine. Early epochs move fast and are not worth scoring often;
  # the best checkpoint almost always turns up late, so that is where the resolution goes.
  # Set eval_every_steps_epoch_mid_threshold to null to collapse back to two tiers.
  eval_every_steps_before: 400            # epochs 1..4
  eval_every_steps_mid: 200               # epochs 5..6
  eval_every_steps_epoch_mid_threshold: 5 # first epoch on the "mid" rate
  eval_every_steps_after: 100             # epoch 7 onward
  eval_every_steps_epoch_threshold: 7     # first epoch on the "after" rate
  eval_every_epochs: null                 # null = no extra epoch-end validation
  validate_before_training: false         # score at step 0, before ANY gradient step.
                                          # For a BRANCH run this is the only clean
                                          # reading of what the seeded weights are worth
                                          # on this run's own inputs; every later number
                                          # mixes that with training. Keep the parent's
                                          # slots and it must reproduce the parent's
                                          # score exactly - a control on the whole path.
  validate_on_resume: false               # score ONCE on the first step after a resume,
                                          # then carry on with the normal cadence. The
                                          # cadence is a modulo on the global step, so a
                                          # checkpoint landing between two validations
                                          # leaves a gap - and changing the cadence
                                          # mid-run widens it. Off by default: a run
                                          # configured correctly from the start has no gap.
  audit:
    enable: true                    # report-only, never drives best.pt (58 studies, +/-0.05)
    csv: "05_audit58.csv"

reproducibility:
  seed: 42
  deterministic: false              # true = bit-identical reruns but noticeably slower

# the whole dataloader block is per-run: batch_size, accum_steps, num_workers,
# prefetch_factor, pin_memory, persistent_workers, drop_last,
# val_batch_size, val_num_workers

# modal.gpu is per-run
# Modal = the cloud GPU service real training runs on; volumes are its persistent disks
modal:
  timeout_hours: 8                  # container is killed past this
  shards_volume: "knee-shards"
  shards_mount: "/shards"
  runs_volume: "knee-runs"
  runs_mount: "/runs"
  wandb_secret: "wandb-secret"

wandb:                              # Weights & Biases, the online metric dashboard
  enabled: false
  project: "knee-abnormality"
  log_every: 20

output:
  run_dir: "results"
  checkpoints_dir: "checkpoints"
  best_name: "best.pt"              # checkpoint of the best-scoring epoch so far
  train_log_csv: "train_log.csv"
  val_log_csv: "val_log.csv"
  summary_json: "training_summary.json"
  console_log_every: 20
  console_capture_dir: "train_config"   # full terminal capture per run
  commit_every_steps: 25            # flush logs to the Modal volume this often;
                                    # independent of validation and checkpoints
  checkpoint_every_steps: 100         # 0 = epoch-end only
  async_checkpoints: true           # write checkpoints on a worker thread, from a
                                    # frozen CPU copy of the tensors. Base writes
                                    # ~2.4 GB per validation and 1 GB every 100 steps;
                                    # inline, the GPU idles through all of it.
                                    # false = the old synchronous behaviour
  keep_last_n: 15                    # rolling window over periodic step checkpoints
  keep_top_k: 12                    # best K validations of the whole run, for ensembling.
                                    # 12 not 8: cross-run blending is where the gain is
                                    # (+0.0029 over the best single model), and a member
                                    # costs one npz - there is no reason to be stingy
  top_k_weights_only: true          # top-K store weights only, ~3x smaller
  save_debug_images: 200            # every N steps dump a batch exactly as the model sees it
  debug_dir: "debugged_images"
  predictions_dir: "predictions"    # raw per-study logits, one .npz per validation
                                    # per split. ~34 KB for the 704-study val set and
                                    # 3 KB for the 58-row panel, so keeping every
                                    # validation costs under a megabyte a run - and
                                    # makes checkpoint ensembling a local, GPU-free job
  make_plots: false                 # NOT on Modal: the container only has its own
                                    # rows it produced itself, so it draws a partial curve.
                                    # Run plot_results.py locally instead - the local CSVs
                                    # are the merged history across every hand-off.
  plots_dir: "plots"
  thresholds_json: "thresholds.json"   # frozen per-finding cut-offs from calibration

# Resume across a CONFIG CHANGE. Normally the engine refuses: a checkpoint outlives the
# config that wrote it, so editing a setting and relaunching would silently continue the
# old run, half of it trained under each setting, and the result would describe neither.
# The guard compares model.name, grad_clip, epochs, the optimizer and scheduler settings,
# input size / slices / slots, target.mode and the train/val CSVs. Preemption and workspace
# hand-offs replay the SAME config so they never trip it, and `extend` and stage-2 hand-offs
# are exempt by design. Set this true in a RUN's config.yaml to continue anyway - it still
# prints a loud warning, because the resulting run is not attributable to either config.
resume_force: false

resume: "last"                      # where to continue from: null | "best" | "last" | <step> | <path>
                                    # "last" = the newest checkpoint on the volume, and it is the
                                    # default because Modal restarts a PREEMPTED container on the
                                    # same input - a hardcoded step number makes it replay from
                                    # there every time (GPU functions cannot opt out of preemption).
                                    # A fresh volume has no checkpoints, so this starts from scratch.
                                    # Watch for the "resuming from ..." banner if you meant to restart.
