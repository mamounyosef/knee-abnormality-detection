# shared_config.yaml — settings common to every knee experiment.
# Each run's config.yaml is deep-merged on top of this (the run wins).

paths:
  data_dir:     "d:/My Projects/knee_abnormality_detection/data"
  shards_dir:   "d:/My Projects/knee_abnormality_detection/data/shards"
  train_csv:    "05_train.csv"          # 3,639 studies, soft LLM labels
  val_csv:      "05_val.csv"            # 704 studies, soft LLM labels
  audit_csv:    "05_audit58.csv"        # 58 studies, the panel's 0/1 labels
  series_index: "07_series_index.csv"

# order fixes every label tensor, metric vector and submission column
tasks:
  - ACL
  - MCL
  - Medial Meniscus
  - Lateral Meniscus
  - Medial OA
  - Lateral OA
  - PF OA
  - Effusion
  - Synovitis
  - Baker's
  - Contusion
  - Fracture

input:
  # the 4 scans fed per study: sag/cor/ax = slicing direction, fluid = bright-water
  # sequence that lights up swelling, plain = normal anatomy contrast
  slots: ["sag_plain", "sag_fluid", "cor_fluid", "ax_fluid"]
  fallback_same_plane: true         # covers the 12.6% missing a slot
  duplicate_rule: "coverage"        # which series wins when several fit one slot
                                    # coverage | resolution | slices | series_number | random

  n_slices: 24                      # real slices, never interpolated
  slice_margin: 0.05                # skip the outer 5% of the stack (edge slices are empty)
  slice_sampling: "even"            # even | random  (val/audit: evenly spaced, reproducible)
  train_slice_sampling: "random"    # doubles as augmentation

  # scanners differ up to 5x in zoom; rescale so a knee is the same pixel size everywhere
  mm_per_px: 0.40                   # null = skip physical resampling
  size: 512                         # 0.40 x 512 = 205 mm, full anatomy in frame
  interpolation: "area"

  # shards were stored with a wide 0.1-99.9 window, which leaves tissue in the bottom
  # ~15% of the range (p50=9/255). Re-window at run time to use the full range.
  window: "volume"                  # shard = leave as stored | volume = one window per stack | slice
  window_pct: [1.0, 99.0]           # clip to these intensity percentiles, then stretch to 0-255
  channels: 3                       # grey slice copied 3x, because ImageNet backbones expect RGB
  norm_mean: [0.485, 0.456, 0.406]  # ImageNet statistics the pretrained weights were trained with
  norm_std:  [0.229, 0.224, 0.225]

# train split only — random distortions so the model generalizes; p = chance per study
augmentation:
  enable: true
  rotation:   {p: 0.3, deg: 10}
  translate:  {p: 0.3, frac: 0.05}
  scale:      {p: 0.3, range: [0.90, 1.10]}
  brightness: {p: 0.3, factor: 0.15}
  contrast:   {p: 0.3, factor: 0.15}
  hflip:      {p: 0.0}              # would swap medial <-> lateral
  slice_dropout: {p: 0.1, frac: 0.1}  # blank a few slices, mimics gaps and artifacts

# labels are probabilities from a language model reading the reports, not 0/1 truth
target:
  mode: "soft"                      # soft = train on the probability | hard = round it to 0/1
  hard_threshold: 0.5
  label_smoothing: 0.0              # hard mode only

# epochs, grad_clip and the whole optimizer / scheduler /
# loss / early_stopping blocks are per-run — see each run's config.yaml
training:
  amp: true                         # mixed precision: half-precision math, ~2x faster, less VRAM
  channels_last: true               # memory layout that suits tensor-core convolutions
  perf:
    tf32: true                      # tensor-float32 matmuls, free speed on Ampere+
    compile: false                  # torch.compile: faster steps, slow first epoch
    compile_mode: "default"

evaluation:
  # validation cadence is driven by the GLOBAL STEP, not the epoch. The epoch only
  # picks which interval applies - early epochs move fast and are not worth scoring
  # often, later ones are where the best checkpoint usually appears.
  eval_every_steps_before: 400            # epochs 1..(threshold-1)
  eval_every_steps_after: 200             # from `threshold` onward
  eval_every_steps_epoch_threshold: 4     # first epoch that uses the "after" rate
  eval_every_epochs: null                 # null = no extra epoch-end validation
  audit:
    enable: true                    # report-only, never drives best.pt (58 studies, +/-0.05)
    csv: "05_audit58.csv"

reproducibility:
  seed: 42
  deterministic: false              # true = bit-identical reruns but noticeably slower

# the whole dataloader block is per-run: batch_size, accum_steps, num_workers,
# prefetch_factor, pin_memory, persistent_workers, drop_last,
# val_batch_size, val_num_workers

# modal.gpu is per-run
# Modal = the cloud GPU service real training runs on; volumes are its persistent disks
modal:
  timeout_hours: 8                  # container is killed past this
  shards_volume: "knee-shards"
  shards_mount: "/shards"
  runs_volume: "knee-runs"
  runs_mount: "/runs"
  wandb_secret: "wandb-secret"

wandb:                              # Weights & Biases, the online metric dashboard
  enabled: false
  project: "knee-abnormality"
  log_every: 20

output:
  run_dir: "results"
  checkpoints_dir: "checkpoints"
  best_name: "best.pt"              # checkpoint of the best-scoring epoch so far
  train_log_csv: "train_log.csv"
  val_log_csv: "val_log.csv"
  summary_json: "training_summary.json"
  console_log_every: 20
  console_capture_dir: "train_config"   # full terminal capture per run
  commit_every_steps: 25            # flush logs to the Modal volume this often;
                                    # independent of validation and checkpoints
  checkpoint_every_steps: 100         # 0 = epoch-end only
  keep_last_n: 15                    # rolling window over periodic step checkpoints
  keep_top_k: 8                     # best K validations of the whole run, for ensembling
  top_k_weights_only: true          # top-K store weights only, ~3x smaller
  save_debug_images: 200            # every N steps dump a batch exactly as the model sees it
  debug_dir: "debugged_images"
  make_plots: false                 # NOT on Modal: the container only has its own
                                    # workspace's CSV rows, so it draws a partial curve.
                                    # Run plot_results.py locally instead - the local CSVs
                                    # are the merged history across every hand-off.
  plots_dir: "plots"
  thresholds_json: "thresholds.json"   # frozen per-finding cut-offs from calibration

resume: null                        # where to continue from: null | "best" | "last" | <step> | <path>
