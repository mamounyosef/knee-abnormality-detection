# convnext_base_25d_v5_slab_mmm
#
# SLAB MIN/MEAN/MAX CHANNELS: each image covers one bin of the stack (6 bins per slot) and holds [MinIP, mean,
# MIP] over EVERY stored slice in it. Today 35-43% of stored slices are never seen; MinIP keeps the dark ACL /
# menisci continuous, MIP keeps fluid / edema bright. Same 24 images per study.
# Copy of convnext_base_25d_18slices_v5_aug_base (val 0.9174 / audit 0.9209 / LB 0.930): ONE change, judged against
# it on the same v5 val + audit-58. LOCAL RTX 4060 (user, 8 Oct: free), recipe of v4_flip_f0.
#
# ---- the donor's notes follow ----
#
# AUGMENTATION-STRENGTH TEST (2 Oct), one of three arms trained together: _base (today's
# augmentation), _strong, _strong_extra. Copy of convnext_base_25d_18slices_oof_convnext_mii_labels_w50 (v4 labels, LB 0.927) moved to the
# v5 split (train data/23_train_w50.csv, val data/23_val_v3_audit.csv = 346 v3-labelled + the 58
# audit studies) with the knee flip ON, as every relabelled member will be. The three arms differ
# ONLY in augmentation, so the comparison is clean on the same val.
# This arm: the BASELINE: today's augmentation (shared_config.yaml), unchanged.
#
# ---- the donor's notes follow ----
#
# LABEL TEST on Modal: convnext_base_25d_18slices_mglabels_raw's exact Modal recipe (LB 0.916), only
# the labels changed to 22_*-w50 = v3 (17_*-raw) 50% + 50% of the mean of two out-of-fold teachers, the
# ConvNeXt folds (convnext_base_25d_18slices_f*) and the MedImageInsight folds
# (medimageinsight_davit_huge_336_v3_f*). Label audit-58 0.9453 (w30 twin 0.9414, ConvNeXt-only 0.9400)
# The ConvNeXt-only 18_* labels' twin (convnext_base_25d_18slices_oof_seedfix, local) scored LB 0.922.
# No knee flip on purpose, to keep the comparison with those twins clean.
#
# ---- the donor's notes follow ----
# UNCALIBRATED TWIN of convnext_base_25d_18slices_mglabels: identical except that MedGemma's
# logit is averaged in on its OWN scale, not rescaled to Qwen's. Trained and submitted in
# parallel with it, so the leaderboard says whether the rescale is right.
#
# convnext_base_25d_18slices with ONE change: the LABELS. Everything else is byte-identical to
# its parent (val 0.9010, audit 0.9054, solo LB 0.914), so its own solo LB answers the only
# question that matters: do the MedGemma-blended labels help a model on the leaderboard? A twin
# with the parent's settings costs no extra run, where a changed config would need a second one.
#
# The labels: Qwen 2.4T everywhere, except Effusion, Synovitis, Baker's, Lateral Meniscus and
# Lateral OA, where MedGemma 1.5 4B's image-only opinion (all six views) is averaged in, in logit
# space, after being put on Qwen's scale. On the panel's audit-58 the LABELS go 0.9114 -> 0.9309.
# Built by data_code/17_make_medgemma_labels.py, all checks in that script.
#
# READ WITH CARE: val now scores against the NEW labels, so val here is not comparable to the
# parent's 0.9010. Audit-58 (panel labels) and the leaderboard are the comparisons.

experiment:
  name: "convnext_base_25d_v5_slab_mmm"

paths:
  # Byte-identical split MEMBERSHIP to convnext_base_25d_group3 and convnext_base_336px.
  train_csv: "23_train_w50.csv"   # v5 split: 3,996 studies on v4 labels (data_code/23_make_split8.py)
  val_csv:   "23_val_v3_audit.csv"   # 346 studies on v3 labels + the 58 audit studies on panel labels
  # audit_csv stays 05_audit58.csv - the panel labels never change, so it is the one
  # honest cross-label-set comparison.

model:
  name: "convnext_base.fb_in22k_ft_in1k"   # timm id: ConvNeXt-Base pretrained on ImageNet-22k
  pretrained: true
  pool: "mean"                      # how the 24 image features collapse per study: mean | max | attn
  drop_rate: 0.1                    # dropout in the head, mild regularization

input:
  channel_mode: "slab_mmm"
  laterality_flip: "left"          # mirror left knees, per plane
  # 336 x 0.40 = 134 mm of frame, unchanged. mm_per_px stays 0.40, the value every run in
  # this project has used: it is the knob that controls interpolation, and at 0.40 exactly
  # 24.4% of series are upsampled (median 1.17x).
  size: 336

  # 18 real slices per slot, down from the shared default of 24. This is the ONLY difference
  # from convnext_base_25d_group3.
  n_slices: 18

  # 6 IMAGES PER SLOT, each holding 3 consecutive slices in its 3 channels.
  # prepare_batch reshapes (B, 4, 18, H, W) -> (B*4*6, 3, H, W). The slice axis splits with
  # the GROUP as the outer index and the CHANNEL as the inner one, so the groups are
  # contiguous and non-overlapping: (0,1,2), (3,4,5), ... (15,16,17).
  # 18 / 6 = 3 means train.py builds the backbone with in_chans=3, i.e. the pretrained stem
  # exactly as shipped. No filter tiling, no rescaling, no adaptation.
  slices_as_channels: 6

training:
  grad_checkpointing: true          # local 8 GB GPU: recompute activations (exact)
  epochs: 12
  grad_clip: 3.0                    # 3.0, NEVER 1.0. 1.0 clips every step and silently
                                    # throttles the effective learning rate.
  optimizer:
    name: "adamw"
    weight_decay: 0.05
    lr: 5.0e-5                      # BACKBONE lr, identical to convnext_base_25d_group3 so
                                    # the slice count is the only variable
    backbone_lr_mult: 0.5           # head = lr / 0.5 = 1.0e-4, twice the trunk
    layer_decay: null
  scheduler:
    name: "cosine"
    warmup_frac: 0.05
    min_lr_mult: 0.01               # floor: ends at 1% of the base learning rate
  loss:
    name: "bce"                     # bce = binary cross-entropy | focal = focuses on hard cases
    pos_weight: null
    focal_gamma: 2.0
    aucm_margin: 1.0
    aucm_bce_mix: 0.1
  early_stopping:
    enable: true
    monitor: "val_macro_auroc"
    mode: "max"
    patience: 6                      # VALIDATIONS without improvement (user, 3 Oct: 6 for all three arms)

# CPU-side loading; decoding shards is the bottleneck and stays one here, though 18 slices
# is a quarter less to decode per study than 24.
dataloader:
  batch_size: 2                     # LOCAL: 2 x accum_steps 4 = the same 8 studies per update
                                    # MEASURED basis: convnext_base_25d_group3 peaked at
                                    # 71.02 GB on 256 images, i.e. ~0.273 GB/image, so 192
                                    # images is ~54 GB of the A100-80GB. Comfortable.
  accum_steps: 4                    # effective 8 studies per update
                                    # other run, so step counts and the lr schedule compare
                                    # directly against convnext_base_25d_group3
  val_batch_size: 4                 # local
                                    # backward pass there are no stored activations, so this
                                    # is far cheaper than the training batch despite being
                                    # twice the studies. Speeds the validations up.

  num_workers: 1                    # local PC: 16 GB RAM ran out with 2 (30 Sep)
                                    # per study, so the loader is the binding constraint
  val_num_workers: 1

  prefetch_factor: 2                # batches queued per worker
  pin_memory: false                 # local: no page-locked memory
  persistent_workers: true          # don't respawn workers every epoch
  drop_last: false                  # keep the ragged final batch

modal:
  gpu: "H100"                     # same model on H100 (convnext_base_25d_all_knees_same_orientation):
                                    # 0.63 s/step vs 1.08 on the A100-80GB, 1.7x faster for 1.58x the
                                    # price ($3.95 vs $2.50/h): cheaper per run. Training math unchanged.
  cpu: 16.0                         # raised with the GPU so the loader keeps up (as that H100 run)
  memory_gb: 64                     # 26 workers x prefetch 6 x ~32 MB per queued batch

# inherits resume: "last" from shared_config - the preemption-safe setting.

output:
  keep_last_n: 1                    # local disk: last.pt covers resume
  keep_top_k: 1
  checkpoint_every_steps: 100       # a crash loses at most 100 steps

evaluation:                          # LOCAL speed-up (8 Oct): ~15 validations instead of ~40 (each ~3 min here)
  eval_every_steps_mid: 400         # epochs 5-6 (shared 200)
  eval_every_steps_after: 300       # epoch 7 on (shared 100); the curves are flat there, best-step grain costs ~nothing
