# convnext_base_v5_raptor96
#
# THE PUBLIC 0.949 / RAPTOR INPUT RECIPE ON OUR STACK (10 Oct, user: go). Their single CoAtNet reached 0.942 public
# WITHOUT external data (other_md/research_results/public_0949_pipeline_diff_oct10.md); ours tops out at 0.930.
# Copied from them: 5 slots, 96 slices (sag fluid 26, sag plain 22, cor fluid 18, cor plain 12, axial 18), the slots
# CONCATENATED into one stack and read as overlapping 3-slice windows [c-1, c, c+1]: 12 random windows per study in
# training, all 94 at eval; 140 mm field (384 px at 0.365 mm/px); slices over 6-94% of each stack; per-finding
# attention pooling (LayerNorm -> Linear(F, 256) -> tanh -> dropout 0.2 -> Linear(256, 12), softmax over windows,
# per-finding linear head); head lr ~50x the backbone (2e-3 vs 4e-5), weight decay 0.059, 16 epochs.
# Kept from ours: ConvNeXt-Base (our best family), v4 labels, v5 split, left-knee flip (per plane, before windowing),
# SAM rho 0.05 (the default for new Modal runs). Judged vs convnext_base_25d_18slices_v5_sam (val 0.9192 / audit
# 0.9286 / clean 0.9133). Not yet shippable as an ensemble member until its inference time is measured (94 windows
# at 384 px per study).
# Cost: 8 studies x 12 windows = 96 images per step (half the SAM run's 192) at 384 px, x2 for SAM, 8,000 steps,
# plus heavier validations (94 windows): ~2 h H100, ~$10.

experiment:
  name: "convnext_base_v5_raptor96"

paths:
  train_csv: "23_train_w50.csv"      # v5 split, v4 labels
  val_csv:   "23_val_v3_audit.csv"   # 346 v3-labelled + the 58 audit studies

model:
  name: "convnext_base.fb_in22k_ft_in1k"
  pretrained: true
  drop_rate: 0.0                    # the head has its own dropout 0.2 inside the attention scorer

input:
  laterality_flip: "left"
  slots: ["sag_fluid", "sag_plain", "cor_fluid", "cor_plain", "ax_fluid"]
  n_slices: {sag_fluid: 26, sag_plain: 22, cor_fluid: 18, cor_plain: 12, ax_fluid: 18}          # 96
  slices_as_channels: {sag_fluid: 26, sag_plain: 22, cor_fluid: 18, cor_plain: 12, ax_fluid: 18} # 1 slice per plane
  window_bag: {train_k: 12, eval_k: 94}
  size: 384
  mm_per_px: 0.365                  # 384 x 0.365 = 140 mm, their crop
  slice_margin: 0.06                # their 6-94% range
  fallback_same_plane: ["sag_fluid", "sag_plain", "cor_fluid", "ax_fluid"]   # NOT cor_plain: a missing one stays blank (masked), as theirs, instead of repeating cor_fluid

training:
  epochs: 16
  grad_clip: 3.0
  optimizer:
    name: "adamw"
    weight_decay: 0.059
    lr: 4.0e-5                      # backbone
    backbone_lr_mult: 0.02          # head = 4e-5 / 0.02 = 2.0e-3 (theirs 1.95e-3)
    layer_decay: null
  scheduler:
    name: "cosine"
    warmup_frac: 0.05
    min_lr_mult: 0.01
  loss:
    name: "bce"
    pos_weight: null
    focal_gamma: 2.0
    aucm_margin: 1.0
    aucm_bce_mix: 0.1
  early_stopping:
    enable: true
    monitor: "val_macro_auroc"
    mode: "max"
    patience: 6
  sam:
    enable: true
    rho: 0.05
    adaptive: false

dataloader:
  batch_size: 8                     # 8 studies x 12 windows = 96 images per step
  accum_steps: 1                    # SAM needs 1
  val_batch_size: 4                 # 4 x 94 = 376 images per eval batch
  num_workers: 26
  val_num_workers: null
  prefetch_factor: 4
  pin_memory: true
  persistent_workers: true
  drop_last: false

modal:
  gpu: "H100"
  cpu: 16.0
  memory_gb: 64

evaluation:
  eval_every_steps_mid: 400         # each validation is 404 studies x 94 windows
  eval_every_steps_after: 250

reproducibility:
  seed: 42
