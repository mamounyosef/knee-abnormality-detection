# barlowtwins_resnet50_336
#
# Barlow Twins ResNet-50, MIT. A CNN trained SELF-SUPERVISED by redundancy
# reduction. Every CNN we ship is supervised-ImageNet and every self-supervised
# model we ship is a ViT, so this fills the empty diagonal. 23.5M parameters, the
# cheapest run of the four. No layer_decay: the LLRD depth assignment is written
# for transformer blocks, and a flat trunk rate is the honest choice for a ResNet.
#
# Beat: convnext_base_25d_18slices, val 0.9010.

experiment:
  name: "barlowtwins_resnet50_336"

paths:
  # Byte-identical split MEMBERSHIP to convnext_base_25d_group3 and convnext_base_336px.
  train_csv: "05_train_qwen24t-med.csv"
  val_csv:   "05_val_qwen24t-med.csv"
  # audit_csv stays 05_audit58.csv - the panel labels never change, so it is the one
  # honest cross-label-set comparison.

model:
  name: "resnet50"
  pretrained: true
  pool: "mean"
  feat_norm: true
  drop_rate: 0.1                    # dropout in the head, mild regularization

input:
  # 336 x 0.40 = 134 mm of frame, unchanged. mm_per_px stays 0.40, the value every run in
  # this project has used: it is the knob that controls interpolation, and at 0.40 exactly
  # 24.4% of series are upsampled (median 1.17x).
  size: 336

  # 18 real slices per slot, down from the shared default of 24. This is the ONLY difference
  # from convnext_base_25d_group3.
  n_slices: 18

  # 6 IMAGES PER SLOT, each holding 3 consecutive slices in its 3 channels.
  # prepare_batch reshapes (B, 4, 18, H, W) -> (B*4*6, 3, H, W). The slice axis splits with
  # the GROUP as the outer index and the CHANNEL as the inner one, so the groups are
  # contiguous and non-overlapping: (0,1,2), (3,4,5), ... (15,16,17).
  # 18 / 6 = 3 means train.py builds the backbone with in_chans=3, i.e. the pretrained stem
  # exactly as shipped. No filter tiling, no rescaling, no adaptation.
  slices_as_channels: 6

training:
  epochs: 12
  lp_ft_epochs: 1
  grad_clip: 5.0
                                    # throttles the effective learning rate.
  optimizer:
    name: "adamw"
    weight_decay: 0.05
    lr: 5.0e-5
                                    # the slice count is the only variable
    backbone_lr_mult: 0.5
    layer_decay: null
  scheduler:
    name: "cosine"
    warmup_frac: 0.05
    min_lr_mult: 0.01               # floor: ends at 1% of the base learning rate
  loss:
    name: "bce"                     # bce = binary cross-entropy | focal = focuses on hard cases
    pos_weight: null
    focal_gamma: 2.0
    aucm_margin: 1.0
    aucm_bce_mix: 0.1
  # EXTENSION. The run finished all 12 epochs at the cosine floor (1% of a 5.0e-5 peak)
  # with its last epochs gaining +0.0011, +0.0010, +0.0005 - converged on its own schedule,
  # not cut short. It ends at 0.8435 against the parent's 0.9010.
  #
  # The case FOR extending: a ResNet-50 is 23.5M parameters against ConvNeXt-Base's 88M, it
  # was pretrained self-supervised with no classification head ever attached, and its first
  # epoch was spent frozen under lp_ft. 12 epochs may simply not be enough to adapt a trunk
  # that has never done supervised classification.
  #
  # The case AGAINST, on record: its frozen probe was 0.6914, and the deceleration is
  # smooth rather than noisy. Closing 0.0575 at +0.0005/epoch is ~100 epochs.
  #
  # 12 more epochs at 3.0e-5 settles it. That is 60% of the original peak, well above the
  # 8.0e-6 used for a fine-tuning nudge, because the question here is whether the trunk can
  # still move a lot - not whether it can be polished. min_lr_mult 0.10 keeps the later
  # epochs working instead of spending them below 1e-7.
  extend:
    enable: true
    epochs: 12                      # on TOP of the 12 already done
    lr: 3.0e-5                      # new PEAK, against the original 5.0e-5
    warmup_frac: 0.02               # short re-warm from the 5.0e-7 floor it ended on
    min_lr_mult: 0.10               # NOT 0.01: 12 epochs at a 1% floor waste most of them
    reset_optimizer: false          # keep the AdamW moments
    reset_patience: true            # early stopping starts fresh

  early_stopping:
    enable: true
    monitor: "val_macro_auroc"
    mode: "max"
    patience: 7

# CPU-side loading; decoding shards is the bottleneck and stays one here, though 18 slices
# is a quarter less to decode per study than 24.
dataloader:
  batch_size: 8
  accum_steps: 1
  val_batch_size: 16
                                    # backward pass there are no stored activations, so this
                                    # is far cheaper than the training batch despite being
                                    # twice the studies. Speeds the validations up.

  num_workers: 26                   # the GPU does a quarter of convnext_base_336px's work
                                    # per study, so the loader is the binding constraint
  val_num_workers: null             # null = same as num_workers

  prefetch_factor: 6                # batches queued per worker
  pin_memory: true                  # page-locked memory, faster CPU -> GPU copies
  persistent_workers: true          # don't respawn workers every epoch
  drop_last: false                  # keep the ragged final batch

modal:
  gpu: "H100"
  cpu: 16.0
  memory_gb: 64

# inherits resume: "last" from shared_config - the preemption-safe setting.
