# ConvNeXt-Base, but with DINOv3 weights instead of ImageNet-22k supervised weights.
#
# This is the cleanest controlled experiment available to us: convnext_base_relabel is the
# SAME architecture, SAME data, SAME hyper-parameters, SAME split. The only thing that
# changes is where the starting weights came from. So it answers one question exactly -
# does the pretraining recipe matter once the architecture is held fixed?
#
#   convnext_base_relabel : ImageNet-22k, supervised classification, 14M labelled images
#   this run              : LVD-1689M, self-supervised, 1.7B unlabelled natural images,
#                           distilled down from a 7B-parameter DINOv3 teacher
#
# Beat: convnext_base_relabel, val 0.9050 / audit 0.9130 - our best single model.
#
# We do NOT use the 7B teacher directly. It cannot be fine-tuned in our memory budget, so
# it could only be used frozen, and the "Resolution scaling governs DINOv3 transfer" paper
# found frozen 7B features LOSING to a fully fine-tuned 86M backbone. The distilled
# ConvNeXt is that teacher's knowledge in a body we can actually train.
#
# LICENSE: DINOv3 is a custom Meta license, not Apache-2.0. Commercial use is permitted but
# it requires the "Built with DINOv3" attribution and passes its terms along to anyone we
# redistribute the weights to - which includes shipping them inside a Kaggle dataset.
# Confirm that against the competition rules before this model goes in a prize submission.

experiment:
  name: "dinov3_convnext_base"

paths:
  train_csv: "05_train_qwen24t-med.csv"
  val_csv:   "05_val_qwen24t-med.csv"

model:
  name: "convnext_base.dinov3_lvd1689m"   # ungated - verified downloading with no HF token
  pretrained: true
  pool: "mean"
  drop_rate: 0.1
  feat_norm: true                       # a fresh LayerNorm between the pooled features and
                                        # the head. Measured: this checkpoint's own final
                                        # LayerNorm has a learned gain averaging 1.96 against
                                        # ImageNet-22k's 1.13, so its features reach the head
                                        # at std 1.53 vs 0.32 - 4.8x. That saturates the logits
                                        # (sigmoid 0.24-0.82 at init vs 0.45-0.59) and scales
                                        # head gradients by the same factor, since dL/dW
                                        # carries f. Without this the run is not a test of
                                        # DINOv3, it is a test of a head tuned for another
                                        # feature scale.
  # fully convolutional, so 512px needs no img_size argument and costs nothing structurally

training:
  # every value below is byte-identical to convnext_base_relabel, on purpose - the weights
  # are the only variable
  epochs: 12
  grad_clip: 3.0                    # see shared_config: 1.0 throttled this trunk on 88% of steps
  optimizer:
    name: "adamw"
    weight_decay: 0.05
    lr: 5.0e-5
    backbone_lr_mult: 0.5               # head = 1.0e-4
    layer_decay: null
  scheduler:
    name: "cosine"
    warmup_frac: 0.05
    min_lr_mult: 0.01
  loss:
    name: "bce"
    pos_weight: null
    focal_gamma: 2.0
    aucm_margin: 1.0
    aucm_bce_mix: 0.1
  # It finished the 12-epoch cosine still climbing - 0.8964, 0.8969, 0.8991, 0.9011 over the
  # last four epochs, no flattening, early stopping never fired. convnext_base_relabel had
  # levelled off by this point, so the gap may be partly schedule rather than weights.
  # A plain resume would sit at 1% of peak (5e-7) and do nothing; extend keeps the weights and
  # the AdamW moments and runs a NEW cosine over the extra epochs.
  extend:
    enable: true
    epochs: 4                         # 13-16, ~1,816 more steps
    lr: 1.5e-6                        # new PEAK, 30% of the original 5e-5 - the same
                                      # fraction mricore_vitb_relabel used when it was
                                      # extended for the same reason. High enough to move
                                      # weights that have been sitting at 5e-7, low enough
                                      # not to undo a converged trunk
    warmup_frac: 0.03                 # ~55 steps of re-warm, so the jump up is not a shock
    min_lr_mult: 0.05                 # the EXTENSION's floor: ends at 8e-7, not 8e-8. Over only
                                      # 4 epochs the run's usual 1% would spend most of the
                                      # extension at a lr too small to move anything
    reset_optimizer: false            # the moments are well-conditioned by now
    reset_patience: true              # the extension gets its own 4 validations of rope

  early_stopping:
    enable: true
    monitor: "val_macro_auroc"
    mode: "max"
    # 4 -> 12 to let the extension actually finish. It stopped at step 6200 of 7264, only
    # 41% in, so it never saw the annealed tail where a cosine usually banks its last gain.
    # `reset_patience` does NOT fire on a continuing extension (by design - a crash must not
    # hand the run fresh rope every time), so `bad` comes back from the checkpoint already
    # sitting at 4. Anything at or below 4 would stop at the very first validation. 12
    # clears the ~6 validations left in the extension with room to spare.
    patience: 12

dataloader:
  batch_size: 2                         # same shape as convnext_base_relabel: ~125 GB of
                                        # the H200's 141 GB
  accum_steps: 4                        # effective 8 studies per update
  val_batch_size: 4
  num_workers: 26
  val_num_workers: null
  prefetch_factor: 4
  pin_memory: true
  persistent_workers: true
  drop_last: false

modal:
  gpu: "H200"
  cpu: 12.0
  memory_gb: 64
