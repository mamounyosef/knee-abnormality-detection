# Pooling ablation - the one part of the architecture never tested.
#
# 12 labels per STUDY, but the backbone sees 96 images, so something must combine
# them. That has always been a plain mean, which dilutes a fracture seen on 2 of 96
# slices by 48x. The per-finding scores match: the FOCAL findings are the weak ones
# (Fracture AUPRC 0.43, MCL 0.50) while diffuse ones are fine (Effusion 0.93).
#
# Capacity is exhausted (Tiny->Small +0.034, Small->Base +0.0008) and both input
# ablations were null, so how the 96 are COMBINED is what is left.
#
# transformer, not the RSNA-standard CNN+GRU, for one reason: those competitions had
# a single volume, so a slice never needed to see another VIEW. We have 4 slots of
# the same knee, and a finding is corroborated across them. Self-attention with a
# slot embedding is the only pooling here where sagittal can look at coronal.

experiment:
  name: "convnext_small_tf"

model:
  name: "convnext_small.fb_in22k_ft_in1k"  # timm id: ConvNeXt-Small pretrained on ImageNet-22k
  pretrained: true
  pool: "transformer"               # how the 96 slice features collapse per study:
                                    # mean | max | attn | transformer
  pool_transformer:
    d_model: 448                    # 7 heads x 64. 768 -> 448 keeps most of the
                                    # backbone width; the projection is the only
                                    # irreversible loss in the block
    n_heads: 7                      # 64 dims per head, the usual width
    n_layers: 1                     # one hop already lets every slice see all 95
                                    # others; a 2nd only adds composition, and this
                                    # dataset has never rewarded more capacity
    ffn_ratio: 2                    # 4 is standard; 2 keeps the block ~2M params
    dropout: 0.1
  drop_rate: 0.1                    # dropout in the head, mild regularization

training:
  epochs: 10
  grad_clip: 1.0                    # cap gradient size so one bad batch can't blow up training
  optimizer:
    name: "adamw"
    weight_decay: 0.05
    lr: 5.0e-5                      # BACKBONE lr — the trunk is 99.9% of the weights
    backbone_lr_mult: 0.5           # head = lr / 0.5 = 1.0e-4, twice the trunk. Knee MRI
                                    # is far from ImageNet, so the trunk needs real adaptation
    layer_decay: null               # layer-wise lr decay, e.g. 0.75: each layer down gets 75%
                                    # of the one above. Replaces backbone_lr_mult when set.
  scheduler:
    name: "cosine"                  # learning rate warms up, then decays along a cosine curve
    warmup_frac: 0.05
    min_lr_mult: 0.01               # floor: ends at 1% of the base learning rate
  loss:
    name: "bce"                     # bce = binary cross-entropy | focal = focuses on hard cases
                                    # aucm = pairwise surrogate for AUROC, the actual metric
    pos_weight: null                # "auto" up-weights rare labels
    focal_gamma: 2.0
    aucm_margin: 1.0                # how far apart aucm pushes a positive from a negative
    aucm_bce_mix: 0.1               # bit of bce mixed in, keeps the probabilities sane
  early_stopping:                   # stop once val stops improving, saves GPU hours
    enable: true
    monitor: "val_macro_auroc"
    mode: "max"
    patience: 4                     # VALIDATIONS without improvement, not epochs.
                                    # With eval_every_steps that is several per
                                    # epoch; the counter is only CHECKED at an
                                    # epoch boundary.

# CPU-side loading; decoding shards is the bottleneck, so keep workers busy
dataloader:
  batch_size: 1                     # 1 study x 4 slots x 24 slices = 96 images @512.
                                    # tiny OOMed at 4 studies, and small holds ~1.8x the
                                    # activations per image, so 2 would sit on the edge —
                                    # an OOM three hours in costs more than this does
  accum_steps: 8                    # effective 8 studies per update -> 455 steps/epoch,
                                    # identical to the tiny run, so the curves compare
  val_batch_size: 2                 # no backward pass, but small needs the headroom

  num_workers: 16
  val_num_workers: null             # null = same as num_workers
  
  prefetch_factor: 4                # batches queued per worker
  pin_memory: true                  # page-locked memory, faster CPU -> GPU copies
  persistent_workers: true          # don't respawn workers every epoch
  drop_last: false                  # keep the ragged final batch

modal:
  gpu: "A100-80GB"                  # 192 images of 512px per step needs the room
  cpu: 10.0                         # one core per dataloader worker; decoding npz is CPU-bound
  memory_gb: 32                     # 16 workers x prefetch 4 holding uint8 volumes

# credits/preemption keep cutting this run short: session 3 stopped at 2900, session 4
# reached 3900 before Modal preempted it, session 6 is now at 4300 of 4540. Checkpoints
# were copied by hand onto each new workspace's knee-runs volume; this last stretch stays
# on session 6, so there is nothing to move.
# "last" rather than a step number: session 4 was preempted, restarted on the same input,
# re-read the number here and replayed 1000 steps it had already done. Right now it
# resolves to step4300.pt - 240 steps, ~20 min from the end.
# fresh run - inherits resume: "last" from shared_config
