# convnext_base_25d_perfinding_pool_features, but on ALL SIX views, with each finding
# reading only the views that can actually show it.
#
# TWO THINGS CHANGE FROM THE PARENT, and they are the same idea applied twice:
#   1. Six slots instead of four. cor_plain and ax_plain were never used by any run.
#   2. Each finding pools only ITS views (SLOT_MAP), instead of all of them.
#
# WHY. In the parent, every finding averages over all 4 views, so the ACL logit is diluted
# by coronal and axial windows that physically cannot show the ACL, and the OA logits are
# diluted by sagittal windows that barely show joint-space narrowing. Giving each finding
# its own views removes that dilution without adding a single parameter to the backbone.
#
# COST. 36 windows per study instead of 24, i.e. 1.5x the parent's forward passes. That is
# the entire cost; the per-finding heads are 12 x (LayerNorm(1024) + Linear(1024, 1)),
# about 37k parameters against the backbone's 88M.
#
# BUILT ON FEATURES, NOT SCORES. The first version of this was built on the instance-level
# (scores) arm. At step 2200 that arm was at 0.8605 against the baseline's 0.8934 at the
# same step - two full epochs behind - and was cut, while the embedding-level (features)
# arm was at 0.8905, within noise. So this is rebuilt on features.
#
# MISSING VIEWS ARE SAFE. cor_plain exists for 77.3% of studies and ax_plain for only 19.4%.
# fallback_same_plane fills a missing slot from the same PLANE, so an absent ax_plain becomes
# another axial window rather than a wrong-plane one, and the finding just reads a view it
# was already reading. A finding never silently gains a plane it did not ask for.
#
# Beat: convnext_base_25d_18slices, val 0.9010, and whatever the 4-slot features arm finishes at.

experiment:
  name: "convnext_base_25d_perfinding_slots_and_pooling"

paths:
  # Byte-identical split MEMBERSHIP to convnext_base_25d_group3 and convnext_base_336px.
  train_csv: "05_train_qwen24t-med.csv"
  val_csv:   "05_val_qwen24t-med.csv"
  # audit_csv stays 05_audit58.csv - the panel labels never change, so it is the one
  # honest cross-label-set comparison.

model:
  name: "convnext_base.fb_in22k_ft_in1k"   # timm id: ConvNeXt-Base pretrained on ImageNet-22k
  pretrained: true
  pool: "mean"                      # how the 24 image features collapse per study: mean | max | attn
  drop_rate: 0.1                    # dropout in the head, mild regularization

input:
  # All six views. The two the project has never used are cor_plain (present for 77.3% of
  # studies) and ax_plain (19.4%); both fall back within their own plane when absent.
  slots: ["sag_plain", "sag_fluid", "cor_plain", "cor_fluid", "ax_plain", "ax_fluid"]

  # 336 x 0.40 = 134 mm of frame, unchanged. mm_per_px stays 0.40, the value every run in
  # this project has used: it is the knob that controls interpolation, and at 0.40 exactly
  # 24.4% of series are upsampled (median 1.17x).
  size: 336

  # 18 real slices per slot, down from the shared default of 24. This is the ONLY difference
  # from convnext_base_25d_group3.
  n_slices: 18

  # 6 IMAGES PER SLOT, each holding 3 consecutive slices in its 3 channels.
  # prepare_batch reshapes (B, 4, 18, H, W) -> (B*4*6, 3, H, W). The slice axis splits with
  # the GROUP as the outer index and the CHANNEL as the inner one, so the groups are
  # contiguous and non-overlapping: (0,1,2), (3,4,5), ... (15,16,17).
  # 18 / 6 = 3 means train.py builds the backbone with in_chans=3, i.e. the pretrained stem
  # exactly as shipped. No filter tiling, no rescaling, no adaptation.
  slices_as_channels: 6

training:
  epochs: 12
  grad_clip: 3.0                    # 3.0, NEVER 1.0. 1.0 clips every step and silently
                                    # throttles the effective learning rate.
  optimizer:
    name: "adamw"
    weight_decay: 0.05
    lr: 5.0e-5                      # BACKBONE lr, identical to convnext_base_25d_group3 so
                                    # the slice count is the only variable
    backbone_lr_mult: 0.5           # head = lr / 0.5 = 1.0e-4, twice the trunk
    layer_decay: null
  scheduler:
    name: "cosine"
    warmup_frac: 0.05
    min_lr_mult: 0.01               # floor: ends at 1% of the base learning rate
  loss:
    name: "bce"                     # bce = binary cross-entropy | focal = focuses on hard cases
    pos_weight: null
    focal_gamma: 2.0
    aucm_margin: 1.0
    aucm_bce_mix: 0.1
  early_stopping:
    enable: true
    monitor: "val_macro_auroc"
    mode: "max"
    patience: 12                     # VALIDATIONS without improvement, not epochs.

# CPU-side loading; decoding shards is the bottleneck and stays one here, though 18 slices
# is a quarter less to decode per study than 24.
dataloader:
  batch_size: 4                     # 4 studies x 6 slots x 6 images = 144 images
                                    # @336. The 4-slot parent peaked at ~54 GB on
                                    # 192 images (~0.28 GB/image), so 144 is ~41 GB
                                    # of the A100-80GB. 8 studies would be 288
                                    # images, ~81 GB, over the card.
  accum_steps: 2                    # 4 x 2 = effective 8 studies per update,
                                    # IDENTICAL to every other run, so step counts
                                    # and the lr schedule compare directly.
  val_batch_size: 8                 # 8 x 36 = 288 images, but no backward pass
                                    # means no stored activations.

  num_workers: 26                   # the GPU does a quarter of convnext_base_336px's work
                                    # per study, so the loader is the binding constraint
  val_num_workers: null             # null = same as num_workers

  prefetch_factor: 6                # batches queued per worker
  pin_memory: true                  # page-locked memory, faster CPU -> GPU copies
  persistent_workers: true          # don't respawn workers every epoch
  drop_last: false                  # keep the ragged final batch

modal:
  gpu: "A100-80GB"                  # 192 images is ~54 GB, so the 80 GB card fits it with
                                    # room. NOT the A100-40GB: that would be over the card.
                                    # At 24 passes per study this run is I/O bound anyway,
                                    # so the faster H200 would idle.
  cpu: 14.0                         # one core per dataloader worker, decoding npz is
                                    # CPU-bound and matters more than ever here
  memory_gb: 64                     # 26 workers x prefetch 6 x ~32 MB per queued batch

# inherits resume: "last" from shared_config - the preemption-safe setting.
