# convnext_base_336px with NON-OVERLAPPING 2.5D. A study becomes 32 images, not 96.
#
# THE CHANGE, in one line. Today every slice becomes its own image and the grey plane is
# COPIED into all three channels, which carries no information at all. Here the three
# channels hold three DIFFERENT, CONSECUTIVE slices: image 0 is slices 0,1,2, image 1 is
# 3,4,5, and so on. Same 24 slices per slot, same 4 slots, but 8 images per slot instead
# of 24. 4 x 8 = 32 forward passes against today's 96, so exactly 3x cheaper.
#
# WHY THIS IS NOT THE FOURTH SLICE-CHANNEL FAILURE. The three runs before it all crushed
# the stem. ConvNeXt-Base's stem is Conv2d(in_chans, 128, k=4, s=4), so per 4x4 patch:
#     convnext_base_slice_input_ch1    24 ch    384 -> 128   3.0x COMPRESSION   0.8663
#     convnext_base_slice_input_ch2    12 ch    192 -> 128   1.5x COMPRESSION   0.8791
#     convnext_base_slice_proj_ramp     8 ch    128 -> 128   1.0x               0.8731
#     THIS RUN                          3 ch     48 -> 128   2.7x EXPANSION     ?
#     convnext_base_336px               3 ch     48 -> 128   2.7x EXPANSION     0.9044
# At three channels the stem is not adapted at all. timm loads the pretrained RGB filters
# unchanged and the information budget is byte-identical to the 0.9044 baseline. The single
# measured cause of the damage in the other three runs is absent here by construction.
#
# AND THE IDEA ALREADY HAS A POSITIVE DATA POINT HERE. convnext_small_25d put NEIGHBOURING
# slices in the RGB channels (slice k gets k-1, k, k+1) and scored val 0.8935 / LB 0.905,
# and it earned an ensemble slot. That run OVERLAPS, so it still costs 24 images per slot
# and saves nothing. This is the same input idea with the overlap removed, and the removal
# is the entire 3x.
#
# WHAT IS ACTUALLY GIVEN UP. Nothing in the channel dimension: the model still sees all 24
# slices, where the baseline's 2nd and 3rd channels were pure duplicates. The real cost is
# that three slices now share one spatial feature map and are mixed at the first
# convolution, and pooling collapses from 96 vectors to 32. That is the hypothesis under
# test and it is the only thing that changes.
#
# COST. 32/96 = 0.333x of convnext_base_336px, which is itself 0.43x of the 512px members.
# So ~0.14x of a standard member. This is the cheapest rung we have and it is the last
# thing the public 0.941 notebook does that we have never tried: their arms run 6 to 42
# passes per study while ours run 96, which is how they afford 47 members and we afford 6.
#
# GEOMETRY IS DELIBERATELY size: 336, NOT size: 512 + resize_to: 336. Those are different
# pictures: `size` changes the FRAME at fixed pixel scale (336 x 0.40 = 134 mm), while
# `resize_to` keeps the 205 mm frame and coarsens to 0.61 mm/px. 336 at 0.40 is the
# validated geometry (0.9044 / LB 0.917) and matches the whole slice-input family, so
# slices_as_channels is the ONE variable. The price is that this member cannot share the
# ensemble's single 512px DICOM decode pass; that is a cost to weigh only if it wins.
#
# Beat: convnext_base_336px, val 0.9044 / LB 0.917, at one third of its compute.

experiment:
  name: "convnext_base_25d_group3"

paths:
  # Byte-identical split MEMBERSHIP to convnext_base_336px, so the comparison is clean.
  train_csv: "05_train_qwen24t-med.csv"
  val_csv:   "05_val_qwen24t-med.csv"
  # audit_csv stays 05_audit58.csv - the panel labels never change, so it is the one
  # honest cross-label-set comparison.

model:
  name: "convnext_base.fb_in22k_ft_in1k"   # timm id: ConvNeXt-Base pretrained on ImageNet-22k
  pretrained: true
  pool: "mean"                      # how the 32 image features collapse per study: mean | max | attn
  drop_rate: 0.1                    # dropout in the head, mild regularization

input:
  # 336 x 0.40 = 134 mm of frame. mm_per_px stays 0.40: it is the knob that controls
  # interpolation, and at 0.40 exactly 24.4% of series are upsampled (median 1.17x), the
  # same as every run to date. See the geometry note in the header.
  size: 336

  # 8 IMAGES PER SLOT, each holding 3 consecutive slices in its 3 channels.
  # prepare_batch reshapes (B, 4, 24, H, W) -> (B*4*8, 3, H, W). The slice axis splits with
  # the GROUP as the outer index and the CHANNEL as the inner one, so the groups come out
  # contiguous and non-overlapping: (0,1,2), (3,4,5), ... (21,22,23). Nothing is dropped
  # and nothing is seen twice.
  # 24 / 8 = 3 means train.py builds the backbone with in_chans=3, i.e. the pretrained stem
  # exactly as shipped. No filter tiling, no rescaling, no adaptation.
  slices_as_channels: 8

training:
  epochs: 12
  grad_clip: 3.0                    # 3.0, NEVER 1.0. 1.0 clips every step and silently
                                    # throttles the effective learning rate below the
                                    # configured one.
  optimizer:
    name: "adamw"
    weight_decay: 0.05
    lr: 5.0e-5                      # BACKBONE lr - the trunk is 99.9% of the weights.
                                    # Unchanged from convnext_base_336px: the stem is now
                                    # pretrained-identical, so that run's tuning is exactly
                                    # the right prior. This was NOT true of ch1/ch2/ramp,
                                    # where the stem started far from its pretrained state.
    backbone_lr_mult: 0.5           # head = lr / 0.5 = 1.0e-4, twice the trunk. Knee MRI
                                    # is far from ImageNet, so the trunk needs real adaptation
    layer_decay: null               # layer-wise lr decay, e.g. 0.75: each layer down gets 75%
                                    # of the one above. Replaces backbone_lr_mult when set.
  scheduler:
    name: "cosine"                  # learning rate warms up, then decays along a cosine curve
    warmup_frac: 0.05
    min_lr_mult: 0.01               # floor: ends at 1% of the base learning rate
  loss:
    name: "bce"                     # bce = binary cross-entropy | focal = focuses on hard cases
                                    # aucm = pairwise surrogate for AUROC, the actual metric
    pos_weight: null                # "auto" up-weights rare labels
    focal_gamma: 2.0
    aucm_margin: 1.0                # how far apart aucm pushes a positive from a negative
    aucm_bce_mix: 0.1               # bit of bce mixed in, keeps the probabilities sane
  early_stopping:                   # stop once val stops improving, saves GPU hours
    enable: true
    monitor: "val_macro_auroc"
    mode: "max"
    patience: 7                     # VALIDATIONS without improvement, not epochs.

# CPU-side loading; decoding shards is the bottleneck, and it is now MORE of one: the
# loader does exactly the same work as convnext_base_336px while the GPU does a third.
dataloader:
  batch_size: 8                     # 4 studies x 4 slots x 8 images = 128 images @336.
                                    # SCALED from measurement, not guessed: convnext_base_336px
                                    # peaked at 53.91 GB on 192 images (batch 2 x 96) at this
                                    # exact resolution and channel count, i.e. ~0.273 GB/image
                                    # once the ~1.4 GB of weights and AdamW state is taken out.
                                    # So 128 images is ~36 GB, comfortable on 80 GB. Batch 8
                                    # would be ~71 GB, which is 89% of the card and too tight
                                    # once fragmentation and the validation pass are added.
  accum_steps: 1                    # effective 8 studies per update - IDENTICAL to every
                                    # other run, so step counts and the lr schedule compare
                                    # directly against convnext_base_336px. Every backbone
                                    # here uses LayerNorm, not BatchNorm, so 4x2 and 8x1 give
                                    # the SAME gradient and the same optimizer steps: this is
                                    # a memory choice only and the comparison is unaffected.
  val_batch_size: 16                 # no backward pass, so no stored activations

  num_workers: 26                   # the GPU does 1/3 the work per study now, so the
                                    # loader is the binding constraint; keep it wide
  val_num_workers: null             # null = same as num_workers

  prefetch_factor: 6                # batches queued per worker
  pin_memory: true                  # page-locked memory, faster CPU -> GPU copies
  persistent_workers: true          # don't respawn workers every epoch
  drop_last: false                  # keep the ragged final batch

modal:
  gpu: "H200"                  # NOT the H200. At 32 passes per study the GPU does a
                                    # third of convnext_base_336px's work while the loader
                                    # does exactly the same decode, so this run is I/O bound
                                    # and the faster card would idle. 128 images is ~36 GB of
                                    # the 80. The A100-40GB that ch2 used is too small: that
                                    # run pushed 64 images per step, this pushes 128.
  cpu: 14.0                         # one core per dataloader worker, decoding npz is
                                    # CPU-bound and matters more than ever here
  memory_gb: 64                     # 26 workers x prefetch 6 x ~43 MB per queued batch is
                                    # ~7 GB of host RAM, so 64 is ample

# inherits resume: "last" from shared_config - the preemption-safe setting.
